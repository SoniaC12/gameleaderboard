spring.application.name=game-leaderboard-api

server.port=8080

application.version=1.0

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/leaderboard_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:leaderboard_user}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:leaderboard_password}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
management.health.livenessstate.enabled=true
management.health.readinessstate.enabled=true

management.endpoint.health.show-details=never